<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#4cb8e8" />
<meta name="description" content="Flappy Bird Hardcore — офлайн-игра в одном HTML-файле." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234cb8e8'/><ellipse cx='29' cy='35' rx='17' ry='13' fill='%23ffd93b' stroke='%238a5a00' stroke-width='2.5'/><circle cx='37' cy='28' r='6' fill='%23fff'/><circle cx='39' cy='28' r='3' fill='%231b1b1b'/><path d='M44 34l11 4-11 4z' fill='%23ff7a1a' stroke='%23b3490a' stroke-width='2'/></svg>" />
<title>Flappy Bird Hardcore</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #2b3a55, #0d1017 70%);
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px;
  }

  .game {
    position: relative;
    height: min(88vh, 720px);
    aspect-ratio: 2 / 3;
    border-radius: 18px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 4px rgba(255, 255, 255, .07);
    cursor: pointer;
  }

  canvas { display: block; width: 100%; height: 100%; }

  .tip {
    margin: 0;
    font-size: 13px;
    letter-spacing: .02em;
    color: rgba(255, 255, 255, .45);
  }

  .sound {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    font-size: 17px;
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 12px;
    background: rgba(10, 18, 30, .35);
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: transform .12s ease, background .2s ease;
  }
  .sound:hover { background: rgba(10, 18, 30, .55); }
  .sound:active { transform: scale(.92); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8, 14, 26, .42);
    backdrop-filter: blur(3px);
    pointer-events: none;
    opacity: 1;
    visibility: visible;
    transition: opacity .25s ease, visibility .25s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }

  .card {
    pointer-events: auto;
    width: 82%;
    padding: 24px 22px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .05));
    box-shadow: 0 18px 44px rgba(0, 0, 0, .4);
    backdrop-filter: blur(10px);
  }

  .card h1 {
    margin: 0 0 8px;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 800;
    letter-spacing: .03em;
    text-shadow: 0 3px 0 rgba(0, 0, 0, .35);
  }

  .card p {
    margin: 0 0 4px;
    font-size: 14px;
    color: rgba(255, 255, 255, .72);
  }

  .scores {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin: 16px 0 4px;
  }
  .scores[hidden] { display: none; }

  .score-item {
    flex: 1;
    padding: 10px 6px;
    border-radius: 14px;
    background: rgba(0, 0, 0, .22);
  }
  .score-item span {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: rgba(255, 255, 255, .6);
  }
  .score-item b {
    display: block;
    margin-top: 2px;
    font-size: 26px;
    font-weight: 800;
  }

  .btn {
    margin-top: 18px;
    padding: 13px 34px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .04em;
    color: #12300a;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(180deg, #9be25c, #5cb32c);
    box-shadow: 0 6px 0 #3d7d1c, 0 10px 20px rgba(0, 0, 0, .35);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #3d7d1c, 0 6px 14px rgba(0, 0, 0, .35);
  }

  .badge {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 12px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .18em;
    color: #ffe1dd;
    background: linear-gradient(180deg, #e0453c, #a11c14);
    border-radius: 999px;
    box-shadow: 0 3px 12px rgba(220, 40, 30, .5);
  }

  .meta {
    margin: 8px 0 0 !important;
    font-size: 12.5px !important;
    font-weight: 600;
    letter-spacing: .02em;
    color: #ffcf8a !important;
  }

  .link {
    display: block;
    margin: 14px auto 0;
    padding: 4px 8px;
    font: inherit;
    font-size: 11.5px;
    color: rgba(255, 255, 255, .5);
    background: none;
    border: 0;
    border-bottom: 1px dashed rgba(255, 255, 255, .3);
    cursor: pointer;
    transition: color .2s ease;
  }
  .link:hover { color: rgba(255, 255, 255, .85); }

  @media (max-height: 620px) {
    .tip { display: none; }
    .game { height: 94vh; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="game" id="game">
      <canvas id="canvas"></canvas>

      <button class="sound" id="soundBtn" type="button" aria-label="Звук">🔊</button>

      <div class="overlay" id="overlay">
        <div class="card">
          <div class="badge">HARDCORE</div>
          <h1 id="title">Flappy Bird</h1>
          <p id="hint">Нажми, чтобы начать</p>
          <p class="meta" id="meta">Забег 0 · дальше ×1.05</p>

          <div class="scores" id="scores" hidden>
            <div class="score-item"><span>Счёт</span><b id="scoreVal">0</b></div>
            <div class="score-item"><span>Рекорд</span><b id="bestVal">0</b></div>
          </div>

          <button class="btn" id="playBtn" type="button">Играть</button>
          <button class="link" id="resetBtn" type="button">Сбросить сложность</button>
        </div>
      </div>
    </div>

    <p class="tip">Пробел / клик / тап — взмах. Каждый забег быстрее предыдущего</p>
  </div>

<script>
(() => {
  'use strict';

  // ---------- Константы ----------
  const W = 400;
  const H = 600;
  const GROUND_H = 90;
  const SKY_H = H - GROUND_H;

  const PIPE_W = 64;
  const CAP_H = 26;
  const PIPE_SPACING = 232;

  const GRAVITY = 1900;
  const FLAP_V = -520;
  const MAX_FALL = 950;
  const BASE_SPEED = 155;
  const BASE_GAP = 165;

  // ---------- Хардкор ----------
  const ROUND_STEP = 0.05;        // +5% к стартовой скорости за каждый забег
  const START_MULT_CAP = 2.0;     // предел накопленного ускорения
  const RUN_RAMP_CAP = 0.6;       // +60% скорости внутри одного забега
  const MAX_SPEED = 400;
  const MIN_GAP = 112;
  const MIN_SPACING = 175;

  // ---------- DOM ----------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const hintEl = document.getElementById('hint');
  const scoresEl = document.getElementById('scores');
  const scoreValEl = document.getElementById('scoreVal');
  const bestValEl = document.getElementById('bestVal');
  const playBtn = document.getElementById('playBtn');
  const soundBtn = document.getElementById('soundBtn');
  const metaEl = document.getElementById('meta');
  const resetBtn = document.getElementById('resetBtn');

  // ---------- Безопасное хранилище (на file:// в Safari localStorage может быть заблокирован) ----------
  function loadNum(key) {
    try { return parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function saveNum(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { /* приватный режим / file:// */ }
  }

  // ---------- Состояние ----------
  let mode = 'ready';          // ready | play | over
  let score = 0;
  let best = loadNum('flappy-best');
  let rounds = loadNum('flappy-rounds');
  let runTime = 0;
  let pipes = [];
  let spawnTimer = 0;
  let groundX = 0;
  let flash = 0;
  let shake = 0;
  let elapsed = 0;
  let overAt = 0;
  let overlayTimer = 0;

  const bird = { x: 110, y: SKY_H * 0.45, vy: 0, r: 15, rot: 0, flap: 0 };

  const clouds = Array.from({ length: 6 }, () => ({
    x: Math.random() * W,
    y: 30 + Math.random() * 220,
    s: 0.5 + Math.random() * 0.9,
    spd: 8 + Math.random() * 16,
  }));

  bestValEl.textContent = best;
  updateMeta();

  // ---------- Canvas / DPR ----------
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- Звук ----------
  let actx = null;
  let muted = false;

  function audio() {
    if (!actx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      actx = new Ctx();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function sound(kind) {
    if (muted) return;
    const a = audio();
    if (!a) return;

    const t = a.currentTime;
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain);
    gain.connect(a.destination);

    if (kind === 'flap') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(620, t);
      osc.frequency.exponentialRampToValueAtTime(300, t + 0.09);
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t);
      osc.stop(t + 0.12);
    } else if (kind === 'score') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.setValueAtTime(1320, t + 0.07);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.11, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
      osc.start(t);
      osc.stop(t + 0.19);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.exponentialRampToValueAtTime(60, t + 0.3);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      osc.start(t);
      osc.stop(t + 0.34);
    }
  }

  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    soundBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) sound('score');
  });

  // ---------- Логика игры ----------
  function startMult() {
    return Math.min(START_MULT_CAP, 1 + rounds * ROUND_STEP);
  }

  function speedNow() {
    // Ускорение за счёт счёта и времени внутри забега + накопленное за забеги
    const ramp = 1 + Math.min(RUN_RAMP_CAP, score * 0.02 + runTime * 0.015);
    return Math.min(MAX_SPEED, BASE_SPEED * startMult() * ramp);
  }

  function gapNow() {
    return Math.max(MIN_GAP, BASE_GAP - rounds * 1.5 - score * 2.5);
  }

  function spacingNow() {
    return Math.max(MIN_SPACING, PIPE_SPACING - rounds * 3 - score * 2);
  }

  function updateMeta() {
    const next = Math.min(START_MULT_CAP, 1 + (rounds + 1) * ROUND_STEP);
    metaEl.textContent = 'Забег ' + rounds + ' · дальше ×' + next.toFixed(2);
  }

  function startGame() {
    score = 0;
    runTime = 0;
    rounds++;
    saveNum('flappy-rounds', rounds);
    pipes = [];
    spawnTimer = 0.55;
    bird.y = SKY_H * 0.45;
    bird.vy = 0;
    bird.rot = 0;
    bird.flap = 0;
    flash = 0;
    shake = 0;
    mode = 'play';
    overlay.classList.add('hidden');
    flap();
  }

  function flap() {
    if (mode !== 'play') return;
    bird.vy = FLAP_V;
    bird.flap = 1;
    sound('flap');
  }

  function gameOver() {
    if (mode !== 'play') return;
    mode = 'over';
    overAt = performance.now();
    flash = 1;
    shake = 14;
    sound('hit');
    if (navigator.vibrate) navigator.vibrate(70);

    if (score > best) {
      best = score;
      saveNum('flappy-best', best);
    }

    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(showOverlay, 550);
  }

  function showOverlay() {
    if (mode !== 'over') return;
    titleEl.textContent = 'Игра окончена';
    hintEl.textContent = score > 0 && score >= best ? 'Новый рекорд!' : 'Попробуй ещё раз';
    scoreValEl.textContent = score;
    bestValEl.textContent = best;
    scoresEl.hidden = false;
    playBtn.textContent = 'Играть снова';
    updateMeta();
    overlay.classList.remove('hidden');
  }

  function spawnPipe() {
    const gap = gapNow();
    const minY = 70;
    const maxY = SKY_H - gap - 70;
    const gapY = minY + Math.random() * Math.max(1, maxY - minY);
    pipes.push({ x: W + 10, gapY, gap, scored: false });
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function update(dt) {
    elapsed += dt;
    if (mode === 'play') runTime += dt;

    const speed = speedNow();
    const scrollSpeed = mode === 'play' ? speed : (mode === 'over' ? 0 : 45);

    groundX = (groundX - scrollSpeed * dt) % 48;

    for (const c of clouds) {
      c.x -= (c.spd + (mode === 'play' ? speed * 0.12 : 0)) * dt;
      if (c.x < -120) {
        c.x = W + 60;
        c.y = 30 + Math.random() * 220;
      }
    }

    if (flash > 0) flash = Math.max(0, flash - dt * 3.5);
    if (shake > 0) shake = Math.max(0, shake - dt * 60);

    // Ожидание старта: птица плавно покачивается
    if (mode === 'ready') {
      bird.y = SKY_H * 0.45 + Math.sin(elapsed * 3) * 8;
      bird.rot = Math.sin(elapsed * 3) * 0.12;
      return;
    }

    // Физика птицы
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;

    const targetRot = Math.max(-0.5, Math.min(1.4, bird.vy / 700));
    bird.rot += (targetRot - bird.rot) * Math.min(1, dt * 10);
    if (bird.flap > 0) bird.flap = Math.max(0, bird.flap - dt * 4);

    // Потолок
    if (bird.y - bird.r < 0) {
      bird.y = bird.r;
      bird.vy = Math.max(bird.vy, 0);
    }

    // Падение после проигрыша
    if (mode === 'over') {
      if (bird.y + bird.r > SKY_H) {
        bird.y = SKY_H - bird.r;
        bird.vy = 0;
      }
      return;
    }

    // Трубы
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnPipe();
      spawnTimer = spacingNow() / speed;
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= speed * dt;

      if (!p.scored && p.x + PIPE_W < bird.x - bird.r) {
        p.scored = true;
        score++;
        sound('score');
      }

      if (p.x + PIPE_W < -20) pipes.splice(i, 1);
    }

    // Столкновения
    if (bird.y + bird.r >= SKY_H) {
      bird.y = SKY_H - bird.r;
      gameOver();
      return;
    }

    const br = bird.r * 0.78;
    for (const p of pipes) {
      const gy1 = p.gapY;
      const gy2 = p.gapY + p.gap;
      if (
        circleRect(bird.x, bird.y, br, p.x, 0, PIPE_W, gy1) ||
        circleRect(bird.x, bird.y, br, p.x, gy2, PIPE_W, SKY_H - gy2)
      ) {
        gameOver();
        return;
      }
    }
  }

  // ---------- Отрисовка ----------
  const skyGrad = ctx.createLinearGradient(0, 0, 0, SKY_H);
  skyGrad.addColorStop(0, '#4cb8e8');
  skyGrad.addColorStop(0.65, '#9fe3f6');
  skyGrad.addColorStop(1, '#d8f4fb');

  function drawSky() {
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, SKY_H + 2);

    // Солнце
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    ctx.arc(320, 78, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(320, 78, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Небо багровеет по мере роста скорости
  function drawHeat() {
    const hot = Math.max(0, Math.min(1, (speedNow() / BASE_SPEED - 1) / 1.2));
    if (hot < 0.02) return;
    ctx.fillStyle = 'rgba(105, 16, 28, ' + (hot * 0.3).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, SKY_H + 1);
  }

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const c of clouds) {
      const s = c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 18 * s, 0, Math.PI * 2);
      ctx.arc(c.x + 20 * s, c.y - 8 * s, 24 * s, 0, Math.PI * 2);
      ctx.arc(c.x + 46 * s, c.y, 17 * s, 0, Math.PI * 2);
      ctx.arc(c.x + 24 * s, c.y + 6 * s, 20 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHills() {
    const off = -groundX * 0.6;

    ctx.fillStyle = '#9ad866';
    ctx.beginPath();
    ctx.moveTo(0, SKY_H);
    for (let x = 0; x <= W; x += 8) {
      const y = SKY_H - 34 - Math.sin((x + off) / 92) * 15 - Math.sin((x + off) / 37) * 6;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, SKY_H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#7cc94b';
    ctx.beginPath();
    ctx.moveTo(0, SKY_H);
    for (let x = 0; x <= W; x += 8) {
      const y = SKY_H - 16 - Math.sin((x + off * 1.5) / 58) * 9;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, SKY_H);
    ctx.closePath();
    ctx.fill();
  }

  function drawPipeBody(x, y, h) {
    const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g.addColorStop(0, '#4f9e2f');
    g.addColorStop(0.28, '#8ed24a');
    g.addColorStop(0.62, '#67b437');
    g.addColorStop(1, '#3f7d26');

    ctx.fillStyle = g;
    ctx.fillRect(x, y, PIPE_W, h);

    ctx.strokeStyle = 'rgba(28, 62, 14, .55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y, PIPE_W - 2, h);
  }

  function drawPipeCap(x, y, w) {
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#4f9e2f');
    g.addColorStop(0.28, '#9ade54');
    g.addColorStop(0.62, '#67b437');
    g.addColorStop(1, '#3f7d26');

    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, CAP_H);

    ctx.strokeStyle = 'rgba(28, 62, 14, .65)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, CAP_H - 2);
  }

  function drawPipes() {
    for (const p of pipes) {
      const gy1 = p.gapY;
      const gy2 = p.gapY + p.gap;

      // Верхняя труба
      drawPipeBody(p.x, 0, Math.max(0, gy1 - CAP_H));
      drawPipeCap(p.x - 5, gy1 - CAP_H, PIPE_W + 10);

      // Нижняя труба
      drawPipeCap(p.x - 5, gy2, PIPE_W + 10);
      drawPipeBody(p.x, gy2 + CAP_H, Math.max(0, SKY_H - gy2 - CAP_H));
    }
  }

  function drawGround() {
    // Трава
    ctx.fillStyle = '#6fc23b';
    ctx.fillRect(0, SKY_H, W, 18);

    ctx.fillStyle = '#4f9e2f';
    ctx.fillRect(0, SKY_H + 15, W, 4);

    // Земля
    ctx.fillStyle = '#e4d79b';
    ctx.fillRect(0, SKY_H + 19, W, GROUND_H - 19);

    // Полосы
    ctx.fillStyle = '#d6c684';
    for (let x = groundX - 48; x < W + 48; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, SKY_H + 19);
      ctx.lineTo(x + 24, SKY_H + 19);
      ctx.lineTo(x + 12, H);
      ctx.lineTo(x - 12, H);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // Хвост
    ctx.fillStyle = '#f0a52a';
    ctx.strokeStyle = '#8a5a00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, -2);
    ctx.lineTo(-24, -9);
    ctx.lineTo(-23, 7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Тело
    const bodyGrad = ctx.createLinearGradient(0, -16, 0, 16);
    bodyGrad.addColorStop(0, '#ffe066');
    bodyGrad.addColorStop(1, '#f2b705');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Живот
    ctx.fillStyle = 'rgba(255, 255, 255, .5)';
    ctx.beginPath();
    ctx.ellipse(1, 5, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Крыло
    const wingAngle = Math.sin(elapsed * 26) * (0.2 + bird.flap * 0.9);
    ctx.save();
    ctx.translate(-4, 1);
    ctx.rotate(wingAngle);
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Глаз
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(9, -6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 80, 0, .35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#1b1b1b';
    ctx.beginPath();
    ctx.arc(11, -6, 3, 0, Math.PI * 2);
    ctx.fill();

    // Клюв
    ctx.fillStyle = '#ff7a1a';
    ctx.strokeStyle = '#b3490a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.lineTo(28, 5);
    ctx.lineTo(15, 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHud() {
    if (mode === 'ready') return;

    const mult = speedNow() / BASE_SPEED;
    const hot = Math.max(0, Math.min(1, (mult - 1) / 1.2));

    ctx.save();
    ctx.textBaseline = 'middle';

    // Множитель скорости под счётом
    const label = '×' + mult.toFixed(2);
    ctx.font = '800 14px system-ui, "Segoe UI", Arial, sans-serif';
    const lw = ctx.measureText(label).width + 26;

    ctx.fillStyle = 'rgba(10, 18, 28, ' + (0.3 + hot * 0.35).toFixed(2) + ')';
    roundRect(W / 2 - lw / 2, 128, lw, 26, 13);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.fillStyle = hot > 0.6 ? '#ffc7b8' : 'rgba(255, 255, 255, .95)';
    ctx.fillText(label, W / 2, 142);

    // Номер забега
    const tag = 'ЗАБЕГ ' + rounds;
    ctx.font = '800 12px system-ui, "Segoe UI", Arial, sans-serif';
    const tw = ctx.measureText(tag).width + 24;

    ctx.fillStyle = 'rgba(10, 18, 28, .32)';
    roundRect(14, 14, tw, 26, 13);
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255, 255, 255, .95)';
    ctx.fillText(tag, 26, 28);

    ctx.restore();
  }

  function drawScore() {
    if (mode === 'ready') return;
    ctx.save();
    ctx.font = '800 56px system-ui, "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 9;
    ctx.strokeStyle = 'rgba(20, 40, 20, .45)';
    ctx.strokeText(String(score), W / 2, 92);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(score), W / 2, 92);
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawSky();
    drawClouds();
    drawHills();
    drawHeat();
    drawPipes();
    drawGround();
    drawBird();

    ctx.restore();

    drawScore();
    drawHud();

    if (flash > 0.01) {
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (flash * 0.7).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Цикл ----------
  let last = performance.now();

  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // ---------- Управление ----------
  function tap() {
    if (mode === 'ready') {
      startGame();
    } else if (mode === 'play') {
      flap();
    } else if (mode === 'over' && performance.now() - overAt > 700) {
      startGame();
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    tap();
  });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      e.preventDefault();
      tap();
    }
  });

  playBtn.addEventListener('click', () => {
    if (mode !== 'play') startGame();
  });

  resetBtn.addEventListener('click', () => {
    rounds = 0;
    runTime = 0;
    saveNum('flappy-rounds', 0);
    updateMeta();
  });

  // При возврате на вкладку не «прыгаем» во времени
  document.addEventListener('visibilitychange', () => {
    last = performance.now();
  });
})();
</script>
</body>
